# Place at the ROOT of the repo. Render Dashboard -> New -> Blueprint -> pick the repo.
# Paid instance types are used on purpose: the ML service (xgboost/shap) and a private
# service do not fit Render's free tier. Check current pricing before applying.
databases:
  - name: phishguard-db
    plan: basic-256mb
    databaseName: phishguard
    user: phishguard

services:
  - type: pserv                      # private: only reachable by your other Render services
    name: phishguard-ml
    runtime: docker
    dockerfilePath: ./docker/ml-service.Dockerfile
    dockerContext: ./ml-service
    plan: starter
    envVars:
      - key: ML_ENV
        value: production
      - key: PORT
        value: "8000"

  - type: web
    name: phishguard-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/ready
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "4000" }
      - { key: AUTH_COOKIE_SECURE, value: "true" }
      - { key: AUTH_COOKIE_SAMESITE, value: lax }
      - { key: TRUST_PROXY_HOPS, value: "2" }
      - { key: ML_SERVICE_URL, value: "http://phishguard-ml:8000" }
      - key: DATABASE_URL
        fromDatabase: { name: phishguard-db, property: connectionString }
      - key: JWT_SECRET            # you must paste a random 48+ char secret in the dashboard
        sync: false
      - key: CORS_ORIGIN           # set to https://<your-app>.vercel.app after the Vercel deploy
        sync: false
